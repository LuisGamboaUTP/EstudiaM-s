<div class="flex h-screen bg-slate-100 text-slate-800">
  <aside class="bg-gray-800 text-white w-64 min-h-screen p-4 flex-col justify-between hidden md:flex">
    <div>
      <a routerLink="/student/dashboard" class="flex items-center space-x-2 text-2xl font-bold mb-10 text-orange-500">
        <span>UTP+class</span>
      </a>
      <nav>
        <ul class="space-y-2">
          <li><a routerLink="/student/dashboard" class="flex items-center space-x-3 px-4 py-3 bg-orange-500 text-white font-semibold rounded-lg">📚 Cursos</a></li>
          <li><a routerLink="/student/calendario" class="flex items-center space-x-3 px-4 py-3 hover:bg-gray-700 rounded-lg">📅 Calendario</a></li>
          <li><a routerLink="/student/chat" class="flex items-center space-x-3 px-4 py-3 hover:bg-gray-700 rounded-lg">💬 Chat</a></li>
          <li><a routerLink="/student/configuracion" class="flex items-center space-x-3 px-4 py-3 hover:bg-gray-700 rounded-lg">⚙️ Configuración</a></li>
        </ul>
      </nav>
    </div>
    <div>
      <ul class="space-y-2 border-t border-gray-700 pt-4 mt-4">
        <li><a (click)="logout()" class="flex items-center space-x-3 px-4 py-3 hover:bg-gray-700 rounded-lg cursor-pointer">🚪 Cerrar Sesión</a></li>
      </ul>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-md p-4">
      <div class="text-xl font-semibold text-orange-500">UTP+class</div>
    </header>

    <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div *ngIf="loading" class="text-center py-8">Cargando...</div>
      
      <div *ngIf="!loading">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Bienvenido, {{ studentName }}</h1>
        <p class="text-gray-600">Esta es tu área de estudiante.</p>
      </div>
    </div>
  </div>
</div>
