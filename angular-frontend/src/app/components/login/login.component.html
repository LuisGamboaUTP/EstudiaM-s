<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="flex w-full max-w-6xl rounded-2xl shadow-2xl overflow-hidden m-4 md:m-0">
    <!-- Panel Izquierdo: Formulario de Login -->
    <div class="w-full md:w-1/2 p-8 sm:p-12 bg-gray-800 text-white flex flex-col justify-center">
      <div class="max-w-md mx-auto w-full">
        <h1 class="text-4xl font-bold mb-2">Login</h1>
        <p class="text-gray-400 mb-8">Ingresa los detalles de tu cuenta</p>

        <!-- Mostrar mensajes de error -->
        <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
          <span>{{ errorMessage }}</span>
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div class="mb-5">
            <label for="email" class="block mb-2 text-sm font-medium text-gray-300">Correo Electrónico</label>
            <input 
              type="text" 
              id="email" 
              name="username"
              [(ngModel)]="credentials.username"
              class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 placeholder-gray-400" 
              placeholder="tu-correo@ejemplo.com" 
              required>
          </div>
          <div class="mb-3 relative">
            <label for="password" class="block mb-2 text-sm font-medium text-gray-300">Contraseña</label>
            <input 
              [type]="showPassword ? 'text' : 'password'"
              id="password" 
              name="password"
              [(ngModel)]="credentials.password"
              class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 placeholder-gray-400" 
              placeholder="•••••••••" 
              required>
            <button 
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 top-7 pr-3 flex items-center text-sm leading-5 text-gray-400">
              <i [class]="showPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
            </button>
          </div>
          <div class="text-right mb-6">
            <a href="#" class="text-sm text-purple-400 hover:underline">¿Olvidaste tu contraseña?</a>
          </div>
          <button 
            type="submit" 
            [disabled]="!loginForm.valid"
            class="w-full text-white bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:outline-none focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-3 text-center transition duration-300 disabled:opacity-50">
            Login
          </button>
        </form>
        
        <div class="mt-8 text-center text-sm text-gray-400">
          ¿No tienes una cuenta? <a href="#" class="font-medium text-purple-400 hover:underline">Regístrate</a>
        </div>
      </div>
    </div>

    <!-- Panel Derecho: Bienvenida e Ilustración -->
    <div class="hidden md:flex w-1/2 bg-purple-600 items-center justify-center p-12 text-white flex-col text-center relative overflow-hidden">
      <svg class="absolute bottom-0 left-0 w-full h-auto z-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
        <path fill="#6533FF" fill-opacity="0.5" d="M0,160L48,170.7C96,181,192,203,288,208C384,213,480,203,576,170.7C672,139,768,85,864,90.7C960,96,1056,160,1152,176C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
      </svg>

      <div class="relative z-10 space-y-4">
        <h2 class="text-4xl font-bold leading-tight">Bienvenido a<br>Aprende +</h2>
        <p class="text-purple-200">Inicia sesión para acceder a tu cuenta</p>
      </div>
    </div>
  </div>
</div>
