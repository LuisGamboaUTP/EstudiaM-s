<div class="flex h-screen bg-slate-100 text-slate-800">
  <aside class="bg-gray-800 text-white w-64 min-h-screen p-4 flex-col justify-between hidden md:flex">
    <div>
      <a routerLink="/profesor/dashboard" class="flex items-center space-x-2 text-2xl font-bold mb-10 text-orange-500">
        <span>UTP+profesor</span>
      </a>
      <nav>
        <ul class="space-y-2">
          <li><a routerLink="/profesor/dashboard" class="flex items-center space-x-3 px-4 py-3 bg-orange-500 text-white font-semibold rounded-lg">📚 Cursos</a></li>
          <li><a routerLink="/profesor/calendario" class="flex items-center space-x-3 px-4 py-3 hover:bg-gray-700 rounded-lg">📅 Calendario</a></li>
          <li><a routerLink="/profesor/chat" class="flex items-center space-x-3 px-4 py-3 hover:bg-gray-700 rounded-lg">💬 Chat</a></li>
          <li><a routerLink="/profesor/configuracion" class="flex items-center space-x-3 px-4 py-3 hover:bg-gray-700 rounded-lg">⚙️ Configuración</a></li>
        </ul>
      </nav>
    </div>
    <div>
      <ul class="space-y-2 border-t border-gray-700 pt-4 mt-4">
        <li><a (click)="logout()" class="flex items-center space-x-3 px-4 py-3 hover:bg-gray-700 rounded-lg cursor-pointer">🚪 Cerrar Sesión</a></li>
      </ul>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-md p-4">
      <div class="text-xl font-semibold text-orange-500">UTP+profesor</div>
    </header>

    <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div *ngIf="loading" class="text-center py-8">Cargando...</div>
      
      <div *ngIf="!loading">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Mis Cursos</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          <div *ngIf="cursos.length === 0" class="col-span-1">
            <div class="bg-white rounded-lg shadow-sm p-6 text-center text-gray-500">No tienes cursos asignados.</div>
          </div>
          <div *ngFor="let curso of cursos" class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col">
            <div class="h-40 w-full bg-orange-500 flex items-center justify-center text-white text-2xl font-bold">
              {{ curso.nombre.substring(0, 2).toUpperCase() }}
            </div>
            <div class="p-4 flex flex-col flex-grow">
              <h3 class="font-bold text-lg">{{ curso.nombre }}</h3>
              <p class="text-sm text-gray-500">{{ curso.codigo }}</p>
              <div class="mt-auto pt-4">
                <button class="w-full text-center bg-orange-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-orange-600 transition-colors">
                  Gestionar Curso
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
